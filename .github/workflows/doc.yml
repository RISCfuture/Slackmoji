name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Documentation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1

      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "latest"

      - name: Record toolchain version
        id: swift
        run: |
          toolchain=$(swift --version)
          digest=$(printf '%s' "$toolchain" | shasum | cut -d' ' -f1)
          [ -n "$digest" ] || { echo "could not determine Swift toolchain version"; exit 1; }
          echo "version=$digest" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-deploy-docs-macos-latest-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}

      - name: Build documentation
        run: |
          swift package \
            --allow-writing-to-directory ./docs \
            generate-documentation \
            --enable-experimental-combined-documentation \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path Slackmoji \
            --output-path ./docs

      - name: Create root redirect
        run: |
          cat > ./docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=/Slackmoji/documentation/slackmoji/">
              <title>Slackmoji Documentation</title>
              <script>
                  window.location.replace("/Slackmoji/documentation/slackmoji/");
              </script>
          </head>
          <body>
              <p>Redirecting to <a href="/Slackmoji/documentation/slackmoji/">Slackmoji Documentation</a>...</p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
